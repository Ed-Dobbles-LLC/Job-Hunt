<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Job Hunt</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c1421;
      --surface: #132035;
      --surface2: #1a2a42;
      --surface3: #213350;
      --border: #1e3554;
      --text: #e8ecf1;
      --text-dim: #7a8ba5;
      --text-muted: #4e6380;
      --accent: #e85d4a;
      --accent-hover: #f06b59;
      --accent-soft: rgba(232, 93, 74, 0.12);
      --green: #22c55e;
      --green-soft: rgba(34, 197, 94, 0.12);
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.12);
      --blue: #3b82f6;
      --blue-soft: rgba(59, 130, 246, 0.12);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .layout { display: flex; min-height: 100vh; }

    .sidebar {
      width: 240px; background: var(--surface); border-right: 1px solid var(--border);
      padding: 24px 0; position: fixed; top: 0; bottom: 0; left: 0; z-index: 50;
      display: flex; flex-direction: column;
    }
    .sidebar-brand { padding: 0 20px 24px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
    .sidebar-brand h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .sidebar-brand .tagline { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

    .nav-section { padding: 0 12px; margin-bottom: 24px; }
    .nav-section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); padding: 0 8px; margin-bottom: 6px; }

    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;
      color: var(--text-dim); text-decoration: none; font-size: 14px; font-weight: 500;
      cursor: pointer; transition: all 0.15s;
    }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: var(--accent-soft); color: var(--accent); }
    .nav-item .nav-icon { width: 20px; text-align: center; font-size: 16px; }

    .sidebar-footer { margin-top: auto; padding: 16px 20px; border-top: 1px solid var(--border); }
    .sidebar-footer .version { font-size: 11px; color: var(--text-muted); }

    .main { flex: 1; margin-left: 240px; min-height: 100vh; }

    .topbar {
      padding: 20px 32px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border); background: var(--surface);
    }
    .topbar h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
    .topbar .sub { font-size: 13px; color: var(--text-dim); margin-top: 2px; }

    .container { max-width: 720px; margin: 32px auto; padding: 0 32px; }

    .status-bar {
      padding: 14px 18px; border-radius: 12px; margin-bottom: 24px; font-size: 14px;
      font-weight: 500; display: none;
    }
    .status-bar.success { display: block; background: var(--green-soft); border: 1px solid var(--green); color: var(--green); }
    .status-bar.error { display: block; background: var(--red-soft); border: 1px solid var(--red); color: var(--red); }

    .group { margin-bottom: 32px; }
    .group-title {
      font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;
      letter-spacing: 0.6px; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
    }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 6px; }

    .field input {
      width: 100%; padding: 11px 14px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text); font-size: 14px;
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
      transition: border-color 0.15s;
    }
    .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .field input::placeholder { color: var(--text-muted); }

    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 6px; font-size: 11px;
      font-weight: 700; margin-left: 8px; letter-spacing: 0.3px;
    }
    .badge.db { background: var(--blue-soft); color: var(--blue); }
    .badge.env { background: var(--green-soft); color: var(--green); }
    .badge.unset { background: var(--red-soft); color: var(--red); }

    .actions { display: flex; gap: 12px; margin-top: 32px; }

    .btn {
      padding: 10px 24px; border-radius: 10px; font-size: 14px; font-weight: 600;
      cursor: pointer; border: 1px solid var(--border); transition: all 0.15s;
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { background: var(--surface3); border-color: var(--border); color: var(--text-muted); cursor: not-allowed; }
    .btn-secondary { background: var(--surface2); color: var(--text); }
    .btn-secondary:hover { background: var(--surface3); border-color: var(--accent); }

    .loading { text-align: center; padding: 48px; color: var(--text-dim); font-size: 15px; }

    @media (max-width: 1024px) { .sidebar { display: none; } .main { margin-left: 0; } }
    @media (max-width: 768px) { .container { padding: 0 16px; } .topbar { padding: 16px; } }
  </style>
</head>
<body>
  <div class="layout">
    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-brand">
        <h1>Job Hunt</h1>
        <div class="tagline">AI-Powered Job Search</div>
      </div>
      <div class="nav-section">
        <div class="nav-section-label">Main</div>
        <a class="nav-item" href="/dashboard"><span class="nav-icon">&#x1F3E0;</span> Dashboard</a>
        <a class="nav-item" href="/profile"><span class="nav-icon">&#x1F464;</span> Profile Builder</a>
        <a class="nav-item active" href="/api/settings"><span class="nav-icon">&#x2699;&#xFE0F;</span> Settings</a>
      </div>
      <div class="sidebar-footer"><div class="version">Job Hunt v1.0</div></div>
    </nav>

    <!-- Main Content -->
    <div class="main">
      <div class="topbar">
        <div>
          <h2>Settings</h2>
          <div class="sub">Configure API keys, job sources, and preferences</div>
        </div>
        <a class="btn btn-secondary" href="/dashboard">Back to Dashboard</a>
      </div>

      <div class="container">
        <div id="status" class="status-bar"></div>
        <div id="content"><div class="loading">Loading settings...</div></div>
      </div>
    </div>
  </div>

  <script>
    let settingsData = [];

    async function loadSettings() {
      try {
        const res = await fetch('/api/settings/list');
        const data = await res.json();
        settingsData = data.settings;
        render();
      } catch (err) {
        showStatus('Failed to load settings: ' + err.message, 'error');
      }
    }

    function render() {
      const groups = {};
      for (const s of settingsData) {
        if (!groups[s.group]) groups[s.group] = [];
        groups[s.group].push(s);
      }

      let html = '';
      for (const [groupName, fields] of Object.entries(groups)) {
        html += `<div class="group"><div class="group-title">${groupName}</div>`;
        for (const f of fields) {
          const badgeClass = f.source === 'database' ? 'db' : f.source === 'environment' ? 'env' : 'unset';
          const badgeText = f.source === 'database' ? 'DB' : f.source === 'environment' ? 'ENV' : 'Not Set';
          const inputType = f.secret ? 'password' : 'text';
          const placeholder = f.secret ? (f.hasValue ? '(hidden - enter new value to change)' : 'Enter value...') : 'Enter value...';
          const displayValue = f.secret ? '' : f.value;
          html += `
            <div class="field">
              <label>${f.label} <span class="badge ${badgeClass}">${badgeText}</span></label>
              <input type="${inputType}" id="setting-${f.key}" data-key="${f.key}"
                     value="${displayValue}" placeholder="${placeholder}">
            </div>`;
        }
        html += '</div>';
      }

      html += `
        <div class="actions">
          <button class="btn btn-primary" onclick="saveSettings()" id="saveBtn">Save Settings</button>
          <button class="btn btn-secondary" onclick="loadSettings()">Reset</button>
        </div>`;

      document.getElementById('content').innerHTML = html;
    }

    async function saveSettings() {
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      const updates = {};
      const inputs = document.querySelectorAll('input[data-key]');
      for (const input of inputs) {
        const key = input.dataset.key;
        const val = input.value.trim();
        if (val) updates[key] = val;
      }

      try {
        const res = await fetch('/api/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ settings: updates }),
        });
        const data = await res.json();
        if (data.success) {
          showStatus(`Saved ${data.updated} setting(s). Some settings take effect on next request; others require a redeploy.`, 'success');
          await loadSettings();
        } else {
          showStatus('Failed to save: ' + (data.error || 'Unknown error'), 'error');
        }
      } catch (err) {
        showStatus('Failed to save: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Save Settings';
      }
    }

    function showStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status-bar ' + type;
      setTimeout(() => { el.className = 'status-bar'; }, 8000);
    }

    loadSettings();
  </script>
</body>
</html>
